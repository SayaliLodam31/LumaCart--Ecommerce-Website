<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LumaCart</title>
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="auth-split-container" style="max-width: 540px; grid-template-columns: 1fr;">
            <div class="auth-form-panel" style="padding: 3.5rem 3rem;">
                <div class="auth-header">
                    <a href="/index.html" class="site-logo" style="margin-bottom: 1.5rem; display: inline-block;">
                        LumaCart<span class="logo-dot"></span>
                    </a>
                    <h1>Reset Password</h1>
                    <p>Enter your registered email address and we will provide password reset instructions.</p>
                </div>

                <form id="forgotForm" class="auth-form">
                    <div class="form-group">
                        <label for="forgotEmail" class="form-label">Email Address</label>
                        <input type="email" id="forgotEmail" class="form-control" placeholder="name@domain.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgotSubmitBtn" style="margin-top: 1rem;">
                        Send Instructions
                    </button>
                </form>

                <div id="resetFeedbackBox" style="display: none; margin-top: 1.5rem; padding: 1.25rem; background: var(--color-bg-subtle); border-radius: var(--border-radius-sm); font-size: 0.88rem; line-height: 1.5;">
                    <p style="color: var(--color-success); font-weight: 600; margin-bottom: 0.5rem;">✓ Reset Token Generated</p>
                    <p id="feedbackTokenMsg" style="color: var(--color-text-secondary);"></p>
                    <a href="#" id="resetLinkDirect" class="btn btn-secondary btn-sm btn-block" style="margin-top: 1rem;">Proceed to Set New Password &rarr;</a>
                </div>

                <div class="auth-footer">
                    <a href="/pages/login.html">&larr; Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/modules/toast.js"></script>
    <script src="/js/modules/apiClient.js"></script>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const btn = document.getElementById('forgotSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            try {
                const res = await window.apiClient.post('/auth/forgot-password/', { email });
                const data = await ApiClient.parseResponse(res);

                window.Toast.info(data.message || 'Reset instructions generated.');
                if (data.dev_token) {
                    const box = document.getElementById('resetFeedbackBox');
                    box.style.display = 'block';
                    document.getElementById('feedbackTokenMsg').textContent = `Security Token: ${data.dev_token}`;
                    document.getElementById('resetLinkDirect').href = `/pages/reset-password.html?token=${data.dev_token}`;
                }
            } catch (err) {
                window.Toast.error('Network error.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Instructions';
            }
        });
    </script>
</body>
</html>
