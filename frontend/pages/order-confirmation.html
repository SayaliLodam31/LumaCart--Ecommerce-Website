<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | LumaCart</title>
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
    <style>
        @media print {
            .site-header, .site-footer, .mobile-bottom-nav, .no-print { display: none !important; }
            .container { max-width: 100% !important; padding: 0 !important; }
            .order-invoice-card { box-shadow: none !important; border: 1px solid #ccc !important; }
        }
    </style>
</head>
<body>

    <div id="site-header-mount"></div>

    <main class="container container-narrow" style="padding: 3.5rem 1.5rem 5rem;">
        <div id="confirmationContent">
            <!-- Loading -->
            <div class="skeleton" style="height: 400px; border-radius: var(--border-radius-md);"></div>
        </div>
    </main>

    <div id="site-footer-mount"></div>
    <div id="mobile-bottom-nav-mount"></div>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/modules/toast.js"></script>
    <script src="/js/modules/apiClient.js"></script>
    <script src="/js/modules/auth.js"></script>
    <script src="/js/modules/cart.js"></script>
    <script src="/js/modules/wishlist.js"></script>
    <script src="/js/modules/websocket.js"></script>
    <script src="/js/modules/ui.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const orderNum = params.get('order_number');

            if (!orderNum) {
                window.location.href = '/pages/orders.html';
                return;
            }

            try {
                const res = await window.apiClient.get(`/orders/${orderNum}/`);
                if (!res.ok) {
                    document.getElementById('confirmationContent').innerHTML = `
                        <div class="state-box">
                            <h2 class="state-title">Order Not Found</h2>
                            <p class="state-description">We could not retrieve details for this order number.</p>
                            <a href="/pages/orders.html" class="btn btn-primary btn-sm">View All Orders</a>
                        </div>
                    `;
                    return;
                }

                const order = await res.json();
                renderConfirmation(order);
            } catch (e) {
                console.error(e);
            }
        });

        function renderConfirmation(order) {
            const container = document.getElementById('confirmationContent');
            const addr = order.shipping_address_json || {};
            const isCod = order.payment?.payment_method === 'cod' || (order.shipping_method && order.shipping_method.toLowerCase().includes('cash on delivery'));

            container.innerHTML = `
                <div style="text-align: center; margin-bottom: 2.5rem;">
                    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--color-success-bg); color: var(--color-success); font-size: 2rem; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                        ✓
                    </div>
                    <span class="section-badge">${isCod ? 'ORDER CONFIRMED &bull; CASH ON DELIVERY' : 'PAYMENT SUCCESSFUL'}</span>
                    <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">Thank You For Your Order</h1>
                    <p style="color: var(--color-text-muted); font-size: 1rem;">
                        Order Reference: <strong style="color: var(--color-text-main);">${order.order_number}</strong>
                    </p>
                </div>

                <!-- Printable Invoice Box -->
                <div class="order-invoice-card" style="background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 2.5rem; box-shadow: var(--shadow-card); margin-bottom: 2.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color-subtle); margin-bottom: 1.5rem;">
                        <div>
                            <span class="site-logo" style="font-size: 1.4rem;">LumaCart<span class="logo-dot"></span></span>
                            <p style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 0.25rem;">Tax Invoice & Order Receipt</p>
                        </div>
                        <div style="text-align: right;">
                            <span class="badge badge-success">${order.status_display}</span>
                            <p style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 0.4rem;">${order.created_at_formatted}</p>
                        </div>
                    </div>

                    <!-- Customer & Shipping info -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; font-size: 0.88rem;">
                        <div>
                            <h4 style="font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); margin-bottom: 0.5rem;">Delivered To</h4>
                            <p><strong>${addr.full_name || ''}</strong></p>
                            <p style="color: var(--color-text-secondary);">${addr.street_address || ''}, ${addr.landmark ? addr.landmark + ', ' : ''}${addr.city || ''}, ${addr.state || ''} - ${addr.postal_code || ''}</p>
                            <p style="color: var(--color-text-muted); margin-top: 0.25rem;">📞 ${addr.phone_number || ''}</p>
                            <p style="color: var(--color-text-muted); font-size: 0.8rem; margin-top: 0.25rem;">🚚 ${order.shipping_method || 'Standard Express'}</p>
                        </div>
                        <div>
                            <h4 style="font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); margin-bottom: 0.5rem;">Payment Information</h4>
                            <p>Method: <strong>${isCod ? 'Cash on Delivery (COD)' : 'Razorpay Standard Gateway'}</strong></p>
                            <p style="color: var(--color-text-secondary);">${isCod ? 'Payment Due: On Doorstep Delivery' : 'Transaction ID: ' + (order.payment ? order.payment.razorpay_payment_id || 'Captured' : 'Confirmed')}</p>
                            <p style="color: var(--color-text-muted);">Currency: INR</p>
                        </div>
                    </div>

                    <!-- Items Table -->
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.88rem;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border-color); text-align: left;">
                                <th style="padding: 0.75rem 0;">Item Description</th>
                                <th style="padding: 0.75rem; text-align: center;">Qty</th>
                                <th style="padding: 0.75rem; text-align: right;">Unit Price</th>
                                <th style="padding: 0.75rem 0; text-align: right;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${order.items.map(item => `
                                <tr style="border-bottom: 1px solid var(--border-color-subtle);">
                                    <td style="padding: 0.85rem 0;">
                                        <strong>${item.product_title}</strong>
                                        <p style="font-size: 0.78rem; color: var(--color-text-muted);">${item.variant_name} &bull; SKU: ${item.sku}</p>
                                    </td>
                                    <td style="padding: 0.85rem; text-align: center;">${item.quantity}</td>
                                    <td style="padding: 0.85rem; text-align: right;">${window.CONFIG.formatCurrency(item.unit_price)}</td>
                                    <td style="padding: 0.85rem 0; text-align: right; font-weight: 600;">${window.CONFIG.formatCurrency(item.subtotal)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <!-- Financial Summary -->
                    <div style="max-width: 320px; margin-left: auto;">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>${window.CONFIG.formatCurrency(order.subtotal)}</span>
                        </div>
                        ${parseFloat(order.discount_amount) > 0 ? `
                            <div class="summary-row" style="color: var(--color-accent-terracotta);">
                                <span>Discount</span>
                                <span>-${window.CONFIG.formatCurrency(order.discount_amount)}</span>
                            </div>
                        ` : ''}
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span>${parseFloat(order.shipping_fee) === 0 ? 'FREE' : window.CONFIG.formatCurrency(order.shipping_fee)}</span>
                        </div>
                        <div class="summary-row">
                            <span>GST (12%)</span>
                            <span>${window.CONFIG.formatCurrency(order.tax_amount)}</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>${isCod ? 'Payable on Delivery' : 'Amount Paid'}</span>
                            <span>${window.CONFIG.formatCurrency(order.total_amount)}</span>
                        </div>
                    </div>
                </div>

                <!-- Action CTA row -->
                <div class="no-print" style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                    <button onclick="window.print()" class="btn btn-outline btn-sm">🖨 Print / Save Invoice</button>
                    <a href="/pages/order-detail.html?order_number=${order.order_number}" class="btn btn-secondary btn-sm">Track Order Timeline</a>
                    <a href="/pages/products.html" class="btn btn-primary btn-sm">Continue Shopping</a>
                </div>
            `;
        }
    </script>
</body>
</html>
