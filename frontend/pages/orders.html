<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | LumaCart</title>
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

    <div id="site-header-mount"></div>

    <main class="container container-narrow" style="padding: 2.5rem 1.5rem 5rem;">
        <div style="margin-bottom: 2rem;">
            <span class="section-badge">PURCHASE HISTORY</span>
            <h1 style="font-size: 2.2rem;">Your Orders</h1>
        </div>

        <div id="ordersListContainer" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="skeleton" style="height: 140px; border-radius: var(--border-radius-md);"></div>
            <div class="skeleton" style="height: 140px; border-radius: var(--border-radius-md);"></div>
        </div>
    </main>

    <div id="site-footer-mount"></div>
    <div id="mobile-bottom-nav-mount"></div>

    <script src="/js/config.js"></script>
    <script src="/js/modules/toast.js"></script>
    <script src="/js/modules/apiClient.js"></script>
    <script src="/js/modules/auth.js"></script>
    <script src="/js/modules/cart.js"></script>
    <script src="/js/modules/wishlist.js"></script>
    <script src="/js/modules/websocket.js"></script>
    <script src="/js/modules/ui.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.authManager.isAuthenticated()) {
                window.location.href = `/pages/login.html?redirect=${encodeURIComponent(window.location.pathname)}`;
                return;
            }

            await loadOrdersList();

            // Realtime WebSocket update when order status updates
            window.addEventListener('order:updated', () => {
                loadOrdersList();
            });
        });

        async function loadOrdersList() {
            const container = document.getElementById('ordersListContainer');
            try {
                const res = await window.apiClient.get('/orders/');
                if (!res.ok) {
                    container.innerHTML = '<div class="state-box"><p>Unable to retrieve orders.</p></div>';
                    return;
                }

                const data = await res.json();
                const orders = data.results || data;

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="state-box">
                            <div class="state-icon">📦</div>
                            <h2 class="state-title">No orders placed yet</h2>
                            <p class="state-description">Your purchased items and shipments will appear here.</p>
                            <a href="/pages/products.html" class="btn btn-primary btn-sm">Explore Collection</a>
                        </div>
                    `;
                    return;
                }

                const statusBadgeMap = {
                    'confirmed': 'badge-success',
                    'delivered': 'badge-success',
                    'shipped': 'badge-sage',
                    'processing': 'badge-sage',
                    'pending_payment': 'badge-warning',
                    'payment_failed': 'badge-danger',
                    'cancelled': 'badge-danger'
                };

                container.innerHTML = orders.map(o => `
                    <div style="background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem;">
                                <strong style="font-size: 1.05rem;">Order #${o.order_number}</strong>
                                <span class="badge ${statusBadgeMap[o.status] || 'badge-sage'}">${o.status_display}</span>
                            </div>
                            <p style="font-size: 0.82rem; color: var(--color-text-muted);">
                                Placed on ${o.created_at_formatted} &bull; ${o.items.length} item(s)
                            </p>
                            <p style="font-size: 0.85rem; color: var(--color-text-secondary); margin-top: 0.4rem;">
                                Total: <strong>${window.CONFIG.formatCurrency(o.total_amount)}</strong>
                            </p>
                        </div>

                        <div style="display: flex; gap: 0.75rem;">
                            <a href="/pages/order-detail.html?order_number=${o.order_number}" class="btn btn-secondary btn-sm">
                                View Details & Track &rarr;
                            </a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
