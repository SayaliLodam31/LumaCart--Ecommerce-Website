<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | LumaCart</title>
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

    <div id="site-header-mount"></div>

    <main class="container container-narrow" style="padding: 2.5rem 1.5rem 5rem;">
        <div style="margin-bottom: 2rem;">
            <span class="section-badge">PERSONAL PROFILE</span>
            <h1 style="font-size: 2.2rem;">Account Settings</h1>
        </div>

        <!-- Profile Details Card -->
        <div class="checkout-card" style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.2rem; margin-bottom: 1.5rem;">Personal Information</h3>
            <form id="profileForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" id="profFirstName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="profLastName" class="form-control">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Email Address (Registered)</label>
                        <input type="email" id="profEmail" class="form-control" readonly disabled style="background-color: var(--color-bg-subtle);">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="profPhone" class="form-control">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm" id="saveProfBtn">Update Profile</button>
            </form>
        </div>

        <!-- Change Password Card -->
        <div class="checkout-card" style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.2rem; margin-bottom: 1.5rem;">Security & Password</h3>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input type="password" id="oldPasswordInput" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password (min 8 chars)</label>
                    <input type="password" id="newPasswordInput" class="form-control" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-secondary btn-sm" id="savePassBtn">Change Password</button>
            </form>
        </div>

        <!-- Address Book -->
        <div class="checkout-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.2rem;">Address Book</h3>
            </div>
            <div id="profileAddressList" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Populated via API -->
            </div>
        </div>
    </main>

    <div id="site-footer-mount"></div>
    <div id="mobile-bottom-nav-mount"></div>

    <script src="/js/config.js"></script>
    <script src="/js/modules/toast.js"></script>
    <script src="/js/modules/apiClient.js"></script>
    <script src="/js/modules/auth.js"></script>
    <script src="/js/modules/cart.js"></script>
    <script src="/js/modules/wishlist.js"></script>
    <script src="/js/modules/websocket.js"></script>
    <script src="/js/modules/ui.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.authManager.isAuthenticated()) {
                window.location.href = `/pages/login.html?redirect=${encodeURIComponent(window.location.pathname)}`;
                return;
            }

            const user = await window.authManager.fetchProfile();
            if (user) {
                document.getElementById('profFirstName').value = user.first_name || '';
                document.getElementById('profLastName').value = user.last_name || '';
                document.getElementById('profEmail').value = user.email || '';
                document.getElementById('profPhone').value = user.phone_number || '';
            }

            loadAddresses();
            setupProfileForm();
            setupPasswordForm();
        });

        function setupProfileForm() {
            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('saveProfBtn');
                btn.disabled = true;
                btn.textContent = 'Updating...';

                try {
                    const res = await window.apiClient.patch('/auth/profile/', {
                        first_name: document.getElementById('profFirstName').value.trim(),
                        last_name: document.getElementById('profLastName').value.trim(),
                        phone_number: document.getElementById('profPhone').value.trim(),
                    });
                    const data = await ApiClient.parseResponse(res);

                    if (res.ok) {
                        window.authManager.setUser(data);
                        window.Toast.success('Profile updated successfully!');
                    } else {
                        window.Toast.error(data.error || 'Failed to update profile.');
                    }
                } catch (e) {
                    window.Toast.error('Network error.');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Update Profile';
                }
            });
        }

        function setupPasswordForm() {
            document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('savePassBtn');
                btn.disabled = true;

                try {
                    const res = await window.apiClient.post('/auth/change-password/', {
                        old_password: document.getElementById('oldPasswordInput').value,
                        new_password: document.getElementById('newPasswordInput').value,
                    });
                    const data = await ApiClient.parseResponse(res);

                    if (res.ok) {
                        window.Toast.success('Password changed successfully!');
                        document.getElementById('changePasswordForm').reset();
                    } else {
                        window.Toast.error(data.error || 'Failed to change password.');
                    }
                } catch (e) {
                    window.Toast.error('Network error.');
                } finally {
                    btn.disabled = false;
                }
            });
        }

        async function loadAddresses() {
            const container = document.getElementById('profileAddressList');
            try {
                const res = await window.apiClient.get('/addresses/');
                if (res.ok) {
                    const data = await res.json();
                    const list = data.results || data;

                    if (list.length === 0) {
                        container.innerHTML = '<p style="color: var(--color-text-muted); font-size: 0.88rem;">No saved addresses in your book.</p>';
                        return;
                    }

                    container.innerHTML = list.map(a => `
                        <div style="background: var(--color-bg-subtle); border-radius: var(--border-radius-sm); padding: 1.25rem; display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem;">
                                    <strong>${a.full_name}</strong>
                                    ${a.is_default ? '<span class="badge badge-sage">Default</span>' : ''}
                                </div>
                                <p style="font-size: 0.85rem; color: var(--color-text-secondary); line-height: 1.5;">
                                    ${a.street_address}, ${a.city}, ${a.state} - ${a.postal_code}
                                </p>
                                <p style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 0.25rem;">📞 ${a.phone_number}</p>
                            </div>
                            <button onclick="deleteAddress(${a.id})" class="btn-ghost btn-sm" style="color: var(--color-error);">Delete</button>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.deleteAddress = async function(id) {
            if (!confirm('Are you sure you want to delete this address?')) return;
            try {
                const res = await window.apiClient.delete(`/addresses/${id}/`);
                if (res.ok) {
                    window.Toast.info('Address removed.');
                    loadAddresses();
                }
            } catch (e) {
                window.Toast.error('Failed to delete address.');
            }
        };
    </script>
</body>
</html>
