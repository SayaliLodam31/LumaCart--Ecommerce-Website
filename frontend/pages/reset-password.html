<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | LumaCart</title>
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="auth-split-container" style="max-width: 540px; grid-template-columns: 1fr;">
            <div class="auth-form-panel" style="padding: 3.5rem 3rem;">
                <div class="auth-header">
                    <a href="/index.html" class="site-logo" style="margin-bottom: 1.5rem; display: inline-block;">
                        LumaCart<span class="logo-dot"></span>
                    </a>
                    <h1>Set New Password</h1>
                    <p>Enter your security token and choose a new password.</p>
                </div>

                <form id="resetForm" class="auth-form">
                    <div class="form-group">
                        <label for="resetTokenInput" class="form-label">Reset Token</label>
                        <input type="text" id="resetTokenInput" class="form-control" placeholder="Paste token here" required>
                    </div>

                    <div class="form-group">
                        <label for="newPasswordInput" class="form-label">New Password (min 8 characters)</label>
                        <input type="password" id="newPasswordInput" class="form-control" placeholder="Enter new password" minlength="8" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetSubmitBtn" style="margin-top: 1rem;">
                        Update Password
                    </button>
                </form>

                <div class="auth-footer">
                    <a href="/pages/login.html">&larr; Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/modules/toast.js"></script>
    <script src="/js/modules/apiClient.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if (token) {
                document.getElementById('resetTokenInput').value = token;
            }

            document.getElementById('resetForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const resetToken = document.getElementById('resetTokenInput').value.trim();
                const newPass = document.getElementById('newPasswordInput').value;
                const btn = document.getElementById('resetSubmitBtn');

                btn.disabled = true;
                btn.textContent = 'Updating...';

                try {
                    const res = await window.apiClient.post('/auth/reset-password/', {
                        token: resetToken,
                        new_password: newPass
                    });
                    const data = await ApiClient.parseResponse(res);

                    if (res.ok) {
                        window.Toast.success(data.message || 'Password reset successfully!');
                        setTimeout(() => window.location.href = '/pages/login.html', 1200);
                    } else {
                        window.Toast.error(data.error || 'Failed to reset password.');
                        btn.disabled = false;
                        btn.textContent = 'Update Password';
                    }
                } catch (e) {
                    window.Toast.error('Network error.');
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                }
            });
        });
    </script>
</body>
</html>
